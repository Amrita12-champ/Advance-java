<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration Form</title>
</head>
<body>

<form action="register" method="get">
    <level>ID</level>
    <input type="number" name="id" placeholder="Enter your id"><br>
    <level>User Name</level>
    <input type="text" name="Username" placeholder="Enter you Name"><br>
    <level>Email</level>
    <input type="email" name="Email" placeholder="Enter you email"><br>
    <level>Registration NO</level>
    <input type="number" name="redg" placeholder="Enter you regd no"><br>
    <button type="submit">Register</button>

</form>

<form action="login" method="post">
    <label>Email</label>
    <input type="email" name="email" placeholder="Enter email to check !">
    <label>Password</label>
    <input type="password" name="password" placeholder="Enter password to verify">
</form>

<form action="admin" method="get">
    <label>Email</label>
    <input type="email" name="email" placeholder="Enter email to check !">
    <label>Password</label>
    <input type="password" name="password" placeholder="Enter password to verify">

</form>

<form action="a" method="get">
    <label>Email</label>
    <input type="email" name="email" placeholder="Enter email to check !">
    <label>Password</label>
    <input type="password" name="password" placeholder="Enter password to verify">
</form>


</body>
</html>
